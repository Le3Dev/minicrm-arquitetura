name: shell

on:
  push:
    branches: [main]
    paths: ['shell/**', '.github/workflows/shell.yml']
  pull_request:
    paths: ['shell/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: shell

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shell/package-lock.json
      - run: npm ci
      - run: npm run lint:types
      - run: npm test
      - run: npm run build
