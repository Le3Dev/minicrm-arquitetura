name: ms-clientes

on:
  push:
    branches: [main]
    paths: ['ms-clientes/**', '.github/workflows/ms-clientes.yml']
    tags: ['ms-clientes-v*']
  pull_request:
    paths: ['ms-clientes/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: ms-clientes

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes unitários, de arquitetura e da API
        run: mvn -B verify
      - name: Relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ms-clientes-surefire
          path: ms-clientes/target/surefire-reports

  # Numa tag ms-clientes-v1.0.0, publica a imagem no Docker Hub.
  # Secrets: DOCKERHUB_USERNAME e DOCKERHUB_TOKEN.
  imagem:
    needs: testes
    if: startsWith(github.ref, 'refs/tags/ms-clientes-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ms-clientes
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/minicrm-ms-clientes:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/minicrm-ms-clientes:latest
