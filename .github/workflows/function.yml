name: function

on:
  push:
    branches: [main]
    paths: ['function/**', '.github/workflows/function.yml', '.github/scripts/**']
  pull_request:
    paths: ['function/**']
  workflow_dispatch:

permissions:
  contents: read
  checks: write

defaults:
  run:
    working-directory: function

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes e empacotamento da Function
        run: mvn -B verify
      - name: Resumo dos testes (check run)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../.github/scripts/resumo-surefire.sh function target/surefire-reports

  # Publica na Function App quando os secrets AZURE_CREDENTIALS existir
  # (az ad sp create-for-rbac --sdk-auth) e a variável AZURE_FUNCTIONAPP_NAME estiver definida.
  deploy:
    needs: testes
    if: github.ref == 'refs/heads/main' && vars.AZURE_FUNCTIONAPP_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy
        run: >
          mvn -B package azure-functions:deploy -DskipTests
          -DfunctionAppName=${{ vars.AZURE_FUNCTIONAPP_NAME }}
          -DfunctionResourceGroup=${{ vars.AZURE_RESOURCE_GROUP }}
