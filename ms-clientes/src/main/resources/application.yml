server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: ms-clientes
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/minicrm}
      auto-index-creation: true
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

app:
  cors-origins: ${CORS_ORIGINS:}
  url-publica: ${URL_PUBLICA:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
