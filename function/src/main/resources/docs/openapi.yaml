openapi: 3.0.3
info:
  title: Mini CRM — Azure Function (Indicadores)
  version: 1.0.0
  description: |
    Rota HTTP da Azure Function do Mini CRM. O BFF chama `POST /api/indicadores` dentro de
    `GET /aggregated-data`, enviando os clientes (MS Clientes) e as oportunidades (MS Oportunidades)
    do escopo do usuário. A resposta alimenta o dashboard (RF11, RF19, RF29, RF31).

    A mesma Function consome o evento **OportunidadeGanha** — veja `/api/eventos`.
servers:
  - url: https://<function-app>.azurewebsites.net
  - url: http://localhost:7071
paths:
  /api/indicadores:
    post:
      summary: Calcula os indicadores do dashboard
      operationId: calcularIndicadores
      tags: [Indicadores]
      security:
        - chaveFunction: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IndicadoresRequest' }
            example:
              clientes:
                - { id: c1, status: Ativo, responsavelId: u2 }
                - { id: c2, status: Prospect, responsavelId: u5 }
              oportunidades:
                - { id: '1', clienteId: c1, etapa: Fechado, resultado: ganho, valor: 18500, responsavelId: u2 }
                - { id: '2', clienteId: c2, etapa: Proposta, resultado: null, valor: 7200, responsavelId: u5 }
                - { id: '3', clienteId: c2, etapa: Fechado, resultado: perdido, motivoPerda: Preço, valor: 3000, responsavelId: u5 }
      responses:
        '200':
          description: Indicadores calculados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Indicadores' }
        '400':
          description: Corpo inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401':
          description: Chave da Function ausente ou inválida
  /api/health:
    get:
      summary: Verificação de saúde
      tags: [Saúde]
      responses:
        '200':
          description: OK
          content:
            application/json:
              example: { status: ok, servico: minicrm-function }
components:
  securitySchemes:
    chaveFunction:
      type: apiKey
      in: header
      name: x-functions-key
  schemas:
    IndicadoresRequest:
      type: object
      required: [clientes, oportunidades]
      properties:
        clientes:
          type: array
          items:
            type: object
            required: [id, status]
            properties:
              id: { type: string }
              status: { type: string, enum: [Prospect, Ativo, Inativo] }
              responsavelId: { type: string }
        oportunidades:
          type: array
          items:
            type: object
            required: [id, etapa, valor]
            properties:
              id: { type: string }
              clienteId: { type: string }
              etapa: { type: string, enum: [Prospecção, Contato, Proposta, Fechado] }
              resultado: { type: string, enum: [ganho, perdido], nullable: true }
              motivoPerda: { type: string, enum: [Preço, Concorrente, Sem verba, Sem resposta], nullable: true }
              valor: { type: number, minimum: 0 }
              responsavelId: { type: string }
    Indicadores:
      type: object
      properties:
        clientes:
          type: object
          properties:
            total: { type: integer, example: 2 }
            porStatus:
              type: object
              additionalProperties: { type: integer }
              example: { Prospect: 1, Ativo: 1, Inativo: 0 }
        oportunidades:
          type: object
          properties:
            total: { type: integer, example: 3 }
            valorEmNegociacao: { type: number, description: Soma das oportunidades não fechadas, example: 7200.00 }
            valorGanho: { type: number, example: 18500.00 }
            ganhas: { type: integer, example: 1 }
            perdidas: { type: integer, example: 1 }
            taxaConversao: { type: number, description: ganhas ÷ (ganhas + perdidas), example: 0.5 }
            porEtapa:
              type: array
              items:
                type: object
                properties:
                  etapa: { type: string }
                  quantidade: { type: integer }
                  valorTotal: { type: number }
            motivosPerda:
              type: object
              additionalProperties: { type: integer }
              example: { Preço: 1 }
        ranking:
          type: array
          description: RF31 — vendedores por valor ganho
          items:
            type: object
            properties:
              responsavelId: { type: string }
              valorGanho: { type: number }
              oportunidadesGanhas: { type: integer }
              oportunidadesPerdidas: { type: integer }
    Erro:
      type: object
      properties:
        codigo: { type: string, example: ENTRADA_INVALIDA }
        erro: { type: string }
