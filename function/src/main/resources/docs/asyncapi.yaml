asyncapi: 3.0.0
info:
  title: Mini CRM — Eventos
  version: 1.0.0
  description: |
    Eventos trocados pelos serviços do Mini CRM pelo Azure Service Bus.

    **OportunidadeGanha**: o MS Oportunidades publica na fila `oportunidade-ganha` quando uma
    oportunidade é movida para **Fechado** com resultado **ganho**. A Azure Function consome a fila
    e chama `POST /clientes/{id}/ativacao` no MS Clientes, que passa o cliente de Prospect para
    **Ativo** (regra RF30 do Mini CRM).

    Garantias:
    - Entrega **pelo menos uma vez**: o mesmo evento pode chegar mais de uma vez. O `eventId`
      torna a ativação idempotente: o MS Clientes processa cada evento uma única vez.
    - Falha temporária (rede, 5xx, conflito de concorrência) faz a Function lançar exceção; o
      Service Bus entrega de novo e, após `maxDeliveryCount` tentativas, move para a dead-letter queue.
    - Cliente inexistente não é repetido: fica registrado no log como pendência.
  license:
    name: MIT
defaultContentType: application/json

servers:
  azure:
    host: '<namespace>.servicebus.windows.net'
    protocol: amqps
    description: Namespace do Azure Service Bus (tier Basic).
    security:
      - $ref: '#/components/securitySchemes/sas'

channels:
  oportunidadeGanha:
    address: oportunidade-ganha
    title: Fila oportunidade-ganha
    messages:
      oportunidadeGanha:
        $ref: '#/components/messages/OportunidadeGanha'

operations:
  publicarOportunidadeGanha:
    action: send
    title: MS Oportunidades publica OportunidadeGanha
    summary: Publicado logo depois de gravar no Azure SQL o fechamento como ganho.
    channel:
      $ref: '#/channels/oportunidadeGanha'
    messages:
      - $ref: '#/channels/oportunidadeGanha/messages/oportunidadeGanha'
  consumirOportunidadeGanha:
    action: receive
    title: Azure Function ativa o cliente
    summary: Gatilho Service Bus `oportunidadeGanha`; chama POST /clientes/{id}/ativacao no MS Clientes.
    channel:
      $ref: '#/channels/oportunidadeGanha'
    messages:
      - $ref: '#/channels/oportunidadeGanha/messages/oportunidadeGanha'

components:
  securitySchemes:
    sas:
      type: httpApiKey
      name: SharedAccessSignature
      in: header
      description: O MS Oportunidades usa uma política só com **Send**; a Function, uma só com **Listen**.
  messages:
    OportunidadeGanha:
      name: OportunidadeGanha
      title: Oportunidade ganha
      summary: Uma oportunidade foi fechada como ganha; o cliente deve passar a Ativo.
      contentType: application/json
      correlationId:
        location: $message.payload#/eventId
      payload:
        $ref: '#/components/schemas/OportunidadeGanha'
      examples:
        - name: fechamento
          payload:
            eventId: 8d2f1c7a-3b4e-4f5a-9c6d-1e2f3a4b5c6d
            type: OportunidadeGanha
            occurredAt: '2026-11-12T15:30:00Z'
            data:
              oportunidadeId: '123'
              clienteId: 3f6c2a1e-8b4d-4c7a-9f10-2b5e6d7c8a90
              valor: 18500.00
              responsavelId: u2
  schemas:
    OportunidadeGanha:
      type: object
      additionalProperties: false
      required: [eventId, type, occurredAt, data]
      properties:
        eventId:
          type: string
          format: uuid
          description: Identificador único do evento; chave da idempotência.
        type:
          type: string
          const: OportunidadeGanha
        occurredAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: false
          required: [oportunidadeId, clienteId, valor, responsavelId]
          properties:
            oportunidadeId:
              type: string
              description: Id da oportunidade no MS Oportunidades (Azure SQL), como texto.
            clienteId:
              type: string
              description: Id do cliente no MS Clientes (MongoDB).
            valor:
              type: number
              exclusiveMinimum: 0
            responsavelId:
              type: string
              description: Vendedor responsável pela oportunidade.
